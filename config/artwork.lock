# Pins for the files Utah takes from projectbluefin/artwork (scripts/fetch-artwork.sh).
# `commit` is the artwork commit every path below is fetched at; each path's
# sha256 is the checksum of the bytes at that commit. Bump them together: a new
# commit with stale checksums fails the build, which is the point. Renovate
# cannot recompute the checksums, so this file is moved by hand.
# The wallpapers are not here: they come from the digest-pinned
# bluefin-wallpapers-gnome image (WALLPAPERS_IMAGE_SHA in the Containerfile),
# which Renovate keeps current.
